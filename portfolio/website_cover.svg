<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" width="1320" height="880">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowLg" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1320" height="880" fill="url(#bgGrad)"/>

  <!-- Decorative Glow Spheres -->
  <circle cx="150" cy="150" r="180" fill="#6366f1" opacity="0.18" filter="url(#glowPurple)"/>
  <circle cx="1200" cy="700" r="220" fill="#ec4899" opacity="0.14" filter="url(#glowPurple)"/>
  <circle cx="950" cy="200" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glowPurple)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="880"/>
    <line x1="240" y1="0" x2="240" y2="880"/>
    <line x1="400" y1="0" x2="400" y2="880"/>
    <line x1="560" y1="0" x2="560" y2="880"/>
    <line x1="720" y1="0" x2="720" y2="880"/>
    <line x1="880" y1="0" x2="880" y2="880"/>
    <line x1="1040" y1="0" x2="1040" y2="880"/>
    <line x1="1200" y1="0" x2="1200" y2="880"/>
    <line x1="0" y1="120" x2="1320" y2="120"/>
    <line x1="0" y1="280" x2="1320" y2="280"/>
    <line x1="0" y1="440" x2="1320" y2="440"/>
    <line x1="0" y1="600" x2="1320" y2="600"/>
    <line x1="0" y1="760" x2="1320" y2="760"/>
  </g>

  <!-- LEFT SECTION: HEADLINES & SPECS -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="260" height="38" rx="19" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ПОРТФОЛИО: РАЗРАБОТКА САЙТОВ</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      ВЕБ-СЕРВИС И САЙТ
    </text>
    <text x="0" y="155" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="-0.5">
      ОНЛАЙН-ЗАПИСИ И УСЛУГ
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      Современный адаптивный лендинг с личным кабинетом,
    </text>
    <text x="0" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      онлайн-бронированием слотов и интеграцией с Telegram.
    </text>

    <!-- Feature Tags Grid -->
    <g transform="translate(0, 290)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="220" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="23" r="4" fill="#38bdf8"/>
      <text x="40" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">100% Адаптивный UI</text>

      <!-- Tag 2 -->
      <rect x="235" y="0" width="240" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="259" cy="23" r="4" fill="#a855f7"/>
      <text x="275" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">FSM Бронирование слотов</text>

      <!-- Tag 3 -->
      <rect x="0" y="60" width="220" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="24" cy="83" r="4" fill="#10b981"/>
      <text x="40" y="88" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Связка с Telegram Bot</text>

      <!-- Tag 4 -->
      <rect x="235" y="60" width="240" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="259" cy="83" r="4" fill="#ec4899"/>
      <text x="275" y="88" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">PageSpeed 98/100 (Быстрый)</text>
    </g>

    <!-- Key Metrics Cards -->
    <g transform="translate(0, 440)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="145" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="24" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">&lt; 0.6с</text>
      <text x="24" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Загрузка сайта</text>

      <!-- Metric 2 -->
      <rect x="165" y="0" width="145" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="189" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">100%</text>
      <text x="189" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Адаптив Mobile</text>

      <!-- Metric 3 -->
      <rect x="330" y="0" width="145" height="100" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="354" y="44" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">+45%</text>
      <text x="354" y="74" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Конверсия в лид</text>
    </g>
  </g>

  <!-- RIGHT SECTION: BROWSER MOCKUP & DASHBOARD UI -->
  <g transform="translate(630, 85)" filter="url(#shadowLg)">
