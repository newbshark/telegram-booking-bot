    <!-- LIVE BADGE -->
    <rect x="520" y="12" width="85" height="24" rx="12" fill="#065f46"/>
    <circle cx="534" cy="24" r="4" fill="#34d399"/>
    <text x="545" y="28" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ONLINE</text>

    <!-- Inside Web Content -->
    <!-- Navigation Bar inside app -->
    <g transform="translate(25, 68)">
      <text x="10" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">MYSTUDIO // BOOKING</text>
      <rect x="440" y="4" width="130" height="32" rx="8" fill="url(#primaryGrad)"/>
      <text x="460" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+ Новая запись</text>
    </g>

    <!-- Stat Widget 1 -->
    <g transform="translate(25, 125)">
      <rect width="180" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Записей за сегодня</text>
      <text x="18" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">18 слотов</text>
      <circle cx="150" cy="50" r="16" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="144" y="55" fill="#60a5fa" font-size="14">📅</text>
    </g>

    <!-- Stat Widget 2 -->
    <g transform="translate(225, 125)">
      <rect width="180" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Выручка (руб)</text>
      <text x="18" y="68" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">48 500 ₽</text>
      <circle cx="150" cy="50" r="16" fill="#10b981" fill-opacity="0.2"/>
      <text x="144" y="55" fill="#34d399" font-size="14">💳</text>
    </g>

    <!-- Stat Widget 3 -->
    <g transform="translate(425, 125)">
      <rect width="180" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Telegram Sync</text>
      <text x="18" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">Синхронно</text>
      <circle cx="150" cy="50" r="16" fill="#0284c7" fill-opacity="0.2"/>
      <text x="144" y="55" fill="#38bdf8" font-size="14">⚡</text>
    </g>

    <!-- Table of Bookings Header -->
    <g transform="translate(25, 235)">
      <rect width="580" height="280" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      
      <!-- Table Header -->
      <rect width="580" height="42" rx="14" fill="#0f172a"/>
      <rect y="24" width="580" height="18" fill="#0f172a"/>
      <text x="20" y="26" fill="#94a3b8" font-size="12" font-weight="600">КЛИЕНТ</text>
      <text x="180" y="26" fill="#94a3b8" font-size="12" font-weight="600">УСЛУГА</text>
      <text x="360" y="26" fill="#94a3b8" font-size="12" font-weight="600">ВРЕМЯ</text>
      <text x="470" y="26" fill="#94a3b8" font-size="12" font-weight="600">СТАТУС</text>
      <line x1="0" y1="42" x2="580" y2="42" stroke="#334155" stroke-width="1"/>

      <!-- Row 1 -->
      <g transform="translate(0, 43)">
        <text x="20" y="35" fill="#f8fafc" font-size="13" font-weight="600">Михаил Соколов</text>
        <text x="20" y="52" fill="#64748b" font-size="11">+7 (999) 456-78-90</text>
        <text x="180" y="42" fill="#cbd5e1" font-size="13">Комплекс "Премиум"</text>
        <text x="360" y="42" fill="#cbd5e1" font-size="13">Сегодня, 14:00</text>
        <rect x="470" y="26" width="90" height="24" rx="12" fill="#065f46"/>
        <text x="486" y="42" fill="#34d399" font-size="11" font-weight="700">Оплачено</text>
        <line x1="15" y1="65" x2="565" y2="65" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 110)">
        <text x="20" y="35" fill="#f8fafc" font-size="13" font-weight="600">Елена Романова</text>
        <text x="20" y="52" fill="#64748b" font-size="11">+7 (921) 123-44-55</text>
        <text x="180" y="42" fill="#cbd5e1" font-size="13">Экспресс-запись</text>
        <text x="360" y="42" fill="#cbd5e1" font-size="13">Сегодня, 16:30</text>
        <rect x="470" y="26" width="90" height="24" rx="12" fill="#1e3a8a"/>
        <text x="480" y="42" fill="#60a5fa" font-size="11" font-weight="700">Подтвержден</text>
        <line x1="15" y1="65" x2="565" y2="65" stroke="#334155" stroke-opacity="0.5" stroke-width="1"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 180)">
        <text x="20" y="35" fill="#f8fafc" font-size="13" font-weight="600">Александр Волков</text>
        <text x="20" y="52" fill="#64748b" font-size="11">+7 (903) 777-11-22</text>
        <text x="180" y="42" fill="#cbd5e1" font-size="13">Индивидуальный сет</text>
        <text x="360" y="42" fill="#cbd5e1" font-size="13">Завтра, 11:00</text>
        <rect x="470" y="26" width="90" height="24" rx="12" fill="#831843"/>
        <text x="492" y="42" fill="#f472b6" font-size="11" font-weight="700">Новый</text>
      </g>
    </g>

    <!-- Bottom Tech Stack Banner inside browser -->
    <g transform="translate(25, 535)">
      <rect width="580" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">СТЕК И ТЕХНОЛОГИИ ПРОЕКТА:</text>
      
      <!-- Tech Pills -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="80" height="32" rx="8" fill="#1e293b"/>
        <text x="18" y="21" fill="#38bdf8" font-size="13" font-weight="700">React</text>

        <rect x="90" y="0" width="95" height="32" rx="8" fill="#1e293b"/>
        <text x="105" y="21" fill="#818cf8" font-size="13" font-weight="700">Node.js</text>

        <rect x="195" y="0" width="85" height="32" rx="8" fill="#1e293b"/>
        <text x="210" y="21" fill="#34d399" font-size="13" font-weight="700">Python</text>

        <rect x="290" y="0" width="85" height="32" rx="8" fill="#1e293b"/>
        <text x="305" y="21" fill="#f59e0b" font-size="13" font-weight="700">SQLite</text>

        <rect x="385" y="0" width="75" height="32" rx="8" fill="#1e293b"/>
        <text x="400" y="21" fill="#38bdf8" font-size="13" font-weight="700">Nginx</text>

        <rect x="470" y="0" width="65" height="32" rx="8" fill="#1e293b"/>
