    <rect width="630" height="690" rx="20" fill="url(#cardGrad)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Browser Header Bar -->
    <rect width="630" height="48" rx="20" fill="#0f172a"/>
    <rect y="30" width="630" height="18" fill="#0f172a"/> <!-- remove bottom round -->
    <line x1="0" y1="48" x2="630" y2="48" stroke="#334155" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>

    <!-- Search/Address Bar -->
    <rect x="100" y="10" width="380" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
