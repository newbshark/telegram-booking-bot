<svg width="1320" height="880" viewBox="0 0 1320 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиенты -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="tgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2aabee" />
      <stop offset="100%" stop-color="#229ed9" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1320" height="880" fill="url(#bgGrad)" />

  <!-- Неоновые фоновые свечения -->
  <circle cx="200" cy="200" r="280" fill="#0284c7" opacity="0.15" filter="url(#glow)" />
  <circle cx="1100" cy="400" r="340" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  <circle cx="700" cy="800" r="250" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />

  <!-- Сетка на фоне -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="110" x2="1320" y2="110" />
    <line x1="0" y1="220" x2="1320" y2="220" />
    <line x1="0" y1="330" x2="1320" y2="330" />
    <line x1="0" y1="440" x2="1320" y2="440" />
    <line x1="0" y1="550" x2="1320" y2="550" />
    <line x1="0" y1="660" x2="1320" y2="660" />
    <line x1="0" y1="770" x2="1320" y2="770" />
    <line x1="165" y1="0" x2="165" y2="880" />
    <line x1="330" y1="0" x2="330" y2="880" />
    <line x1="495" y1="0" x2="495" y2="880" />
    <line x1="660" y1="0" x2="660" y2="880" />
    <line x1="825" y1="0" x2="825" y2="880" />
    <line x1="990" y1="0" x2="990" y2="880" />
    <line x1="1155" y1="0" x2="1155" y2="880" />
  </g>

  <!-- ЛЕВАЯ ЧАСТЬ: ТЕКСТ И ПРЕИМУЩЕСТВА -->
  
  <!-- Верхний тег-бейдж -->
  <g transform="translate(90, 95)">
    <rect width="280" height="42" rx="21" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8" />
    <text x="38" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" letter-spacing="1">РАЗРАБОТКА ПОД КЛЮЧ</text>
  </g>

  <!-- Заголовок -->
  <text x="90" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">TELEGRAM-БОТЫ</text>
  <text x="90" y="315" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-1">ДЛЯ БИЗНЕСА</text>

  <!-- Подзаголовок / Буллеты -->
  <g transform="translate(90, 395)">
    <!-- Пункт 1 -->
    <g transform="translate(0, 0)">
      <rect width="44" height="44" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="30" font-family="sans-serif" font-size="22" fill="#38bdf8">✓</text>
      <text x="64" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#f1f5f9">Онлайн-запись и бронирование клиентов</text>
    </g>

    <!-- Пункт 2 -->
    <g transform="translate(0, 75)">
      <rect width="44" height="44" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="30" font-family="sans-serif" font-size="22" fill="#38bdf8">✓</text>
      <text x="64" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#f1f5f9">Интеграция с Google Таблицами и CRM</text>
    </g>

    <!-- Пункт 3 -->
    <g transform="translate(0, 150)">
      <rect width="44" height="44" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="30" font-family="sans-serif" font-size="22" fill="#38bdf8">✓</text>
      <text x="64" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#f1f5f9">Каталоги услуг, корзина и приём заявок 24/7</text>
    </g>
  </g>

  <!-- Нижние плашки доверия -->
  <g transform="translate(90, 675)">
    <g transform="translate(0, 0)">
      <rect width="210" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">⚡ Запуск за 24–48ч</text>
    </g>

    <g transform="translate(230, 0)">
      <rect width="220" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#4ade80">🛡 Без предоплаты</text>
    </g>

    <g transform="translate(470, 0)">
      <rect width="200" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="24" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#facc15">★ Тест-демо есть</text>
    </g>
  </g>

  <!-- ПРАВАЯ ЧАСТЬ: ИНТЕРАКТИВНЫЕ ВИЗУАЛЫ И КАРТОЧКИ (3D MOCKUP) -->

  <!-- Большая карточка заказа / уведомления (Glassmorphism) -->
  <g transform="translate(790, 180)" filter="url(#softShadow)">
    <rect width="440" height="490" rx="28" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Хедер карточки бота -->
    <rect width="440" height="85" rx="28" fill="#1e293b" fill-opacity="0.6" />
    
    <!-- Аватар Telegram -->
    <circle cx="60" cy="42" r="26" fill="url(#tgGrad)" />
    <!-- Самолетик Telegram -->
    <path d="M48 42 L72 32 L66 52 L58 46 Z" fill="#ffffff" />
    <path d="M58 46 L56 50 L58 46 Z" fill="#b0d6f5" />

    <text x="100" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Business Bot</text>
    <text x="100" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#38bdf8">онлайн • принимает заказы</text>
    
    <!-- Карточка заявки внутри интерфейса -->
    <g transform="translate(30, 115)">
      <rect width="380" height="230" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" />
      
      <text x="25" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">🔔 НОВАЯ ЗАЯВКА #1042</text>
      
      <line x1="25" y1="55" x2="355" y2="55" stroke="#334155" stroke-width="1" />
      
      <text x="25" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Клиент:</text>
      <text x="110" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Александр (@alex)</text>

      <text x="25" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Услуга:</text>
      <text x="110" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">Комплекс / Запись</text>

      <text x="25" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8">Время:</text>
      <text x="110" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Завтра, 14:00</text>

      <text x="25" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#4ade80">Сумма: 4 500 ₽</text>
      <rect x="250" y="172" width="105" height="34" rx="10" fill="#22c55e" fill-opacity="0.2" stroke="#4ade80" stroke-width="1" />
      <text x="268" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#4ade80">В базе ✓</text>
    </g>

    <!-- Интерактивные кнопки меню бота -->
    <g transform="translate(30, 365)">
      <rect width="180" height="48" rx="12" fill="#0284c7" />
      <text x="35" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">📅 Записаться</text>

      <rect x="200" y="0" width="180" height="48" rx="12" fill="#334155" />
      <text x="235" y="30" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">📋 Прайс-лист</text>
    </g>
  </g>

  <!-- Плавающий бейдж с Google Таблицей -->
  <g transform="translate(720, 560)" filter="url(#softShadow)">
    <rect width="260" height="80" rx="20" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="45" cy="40" r="22" fill="#22c55e" fill-opacity="0.2" />
    <text x="33" y="47" font-family="sans-serif" font-size="20" fill="#22c55e">📊</text>
    <text x="80" y="36" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Google Таблицы</text>
    <text x="80" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#4ade80">Автовыгрузка базы</text>
  </g>
</svg>
