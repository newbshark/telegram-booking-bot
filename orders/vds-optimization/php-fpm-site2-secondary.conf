; [site2-secondary]
; Пул с жестким ограничением ресурсов для ВТОРИЧНОГО сайта
; Расположение: /etc/php/8.x/fpm/pool.d/site2_secondary.conf

[site2-secondary]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm-site2-secondary.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Режим ondemand: воркеры запускаются ТОЛЬКО при реальном запросе и выгружаются из RAM
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 15s
pm.max_requests = 500

; Пониженный приоритет процессов (уступает процессор первому сайту):
process.priority = 10

; Жесткий лимит памяти, чтобы второй сайт ни при каких условиях не уронил VDS
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 30
