# Конфигурация Nginx для связки React (Frontend SPA) + PHP (Backend)
# Решает проблему падений сервера и отдает статику напрямую без нагрузки на процессор

server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/site1/public;
    index index.html index.php;

    # Gzip сжатие (ускоряет загрузку и снижает трафик)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # 1. Отдача статики React (JS, CSS, изображения, шрифты)
    # Кэширование на стороне браузера без обращения к диску
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # 2. Роутинг SPA (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Обработка API / PHP бэкенда
    # Запросы на /api или .php направляются в приоритетный пул PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm-site1-priority.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        
        # Защита от зависания тяжелых запросов
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    # Защита скрытых файлов
    location ~ /\. {
        deny all;
    }
}
