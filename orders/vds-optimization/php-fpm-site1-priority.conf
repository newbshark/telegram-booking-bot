; [site1-priority]
; Пул высокой производительности для ПРИОРИТЕТНОГО сайта
; Расположение: /etc/php/8.x/fpm/pool.d/site1_priority.conf

[site1-priority]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm-site1-priority.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Динамический режим: воркеры всегда прогреты в памяти и мгновенно отвечают
pm = dynamic
pm.max_children = 25
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Приоритет процессов на уровне ядра Linux (nice):
; Отрицательное значение дает приоритет CPU над другими процессами
process.priority = -5

; Лимиты памяти под приоритетный сайт
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
